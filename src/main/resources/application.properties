spring.application.name=autofacapi
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autofacapi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.dbname=${DB_NAME:autofacapi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
hibernate.dialect=org.hibernate.dialect.HSQLDialect

spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.show-sql=true
spring.jpa.format-sql=true

siigo.email=${SIIGO_EMAIL:}
siigo.password=${SIIGO_PASSWORD:}

# Carpeta de perfil de Chrome persistente (para que Siigo recuerde el dispositivo tras la verificacion por SMS)
siigo.chrome.profile-dir=${SIIGO_CHROME_PROFILE_DIR:./chrome-profile-siigo}

# Sincronizacion automatica de facturas Siigo (cron, hora del servidor en la zona indicada)
siigo.sync.cron=${SIIGO_SYNC_CRON:0 * * * * *}
siigo.sync.zone=${SIIGO_SYNC_ZONE:America/Bogota}

documentos.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

jwt.secret=${JWT_SECRET:oNiuWmEPRww29z8H0A0Yu8V2sV4LmC2MJ8FPlgfEJ2c=}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

admin.seed.email=${ADMIN_EMAIL:}
admin.seed.password=${ADMIN_PASSWORD:}

cors.origins=${CORS_ORIGINS:http://localhost:4200,https://autofac.faseblu.com}