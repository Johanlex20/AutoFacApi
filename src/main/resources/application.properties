spring.application.name=autofacapi
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autofacapi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.dbname=${DB_NAME:autofacapi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
hibernate.dialect=org.hibernate.dialect.HSQLDialect

spring.jpa.generate-ddl=true
